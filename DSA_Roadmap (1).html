<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--card2:#eef0f4;--tx:#1b1e26;--mut:#6a7183;--ln:#cfd4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--card2:#232733;--tx:#e8eaf0;--mut:#8b92a3;--ln:#343a48}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--card2:#232733;--tx:#e8eaf0;--mut:#8b92a3;--ln:#343a48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Kalam',ui-rounded,'Segoe UI',sans-serif;min-height:100vh}
header{position:relative;padding:22px 24px 6px;max-width:1300px;margin:auto}
.tg{position:absolute;right:24px;top:22px;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}.tg:hover{border-color:#f59e0b}
h1{margin:0;font-size:28px}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.bar{height:8px;background:var(--card2);border-radius:8px;margin-top:12px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#34d399);border-radius:8px;transition:width .4s}
#map{position:relative;display:flex;gap:90px;padding:24px;max-width:1300px;margin:auto;align-items:flex-start;overflow-x:auto}
#map>svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:10px;min-width:230px;position:relative;z-index:1}
.node{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:11px 14px;font:inherit;font-size:17px;text-align:left;cursor:pointer;transition:transform .2s,opacity .25s,border-color .2s,background .2s}
.node:hover{transform:translateX(4px);border-color:var(--c,#f59e0b)}
.node.on{border-color:var(--c);background:var(--card2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.node.dim{opacity:.35}
.node small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.mini{height:4px;border-radius:4px;background:var(--bg);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);transition:width .3s}
.panel{border:2px solid var(--c);background:var(--card);border-radius:14px;padding:12px 8px;min-width:300px;max-width:420px}
.panel h3{margin:0 8px 8px;font-size:16px;color:var(--c)}
.q{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:15px}
.q:hover{background:var(--card2)}
.q input{accent-color:var(--c);width:17px;height:17px;flex:none}
.q span{flex:1}.q em{font-style:normal;color:var(--mut);font-size:13px;white-space:nowrap}
.q a{color:inherit;text-decoration:none}.q a:hover{color:var(--c);text-decoration:underline}
.q.d span{text-decoration:line-through;color:var(--mut)}
.a .node,.a.panel{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateX(-14px) scale(.95)}to{opacity:1;transform:none}}
.hint{color:var(--mut);padding:10px 4px;font-size:15px}
@media(max-width:760px){#map{flex-direction:column;gap:16px;padding:16px}#map>svg{display:none}.col{min-width:0}.panel{min-width:0;max-width:none}}
</style>
</head>
<body>
<header><button class="tg" id="tg"></button><h1>🧠 DSA Roadmap</h1><div class="sub" id="ov"></div><div class="bar"><i id="ob"></i></div></header>
<div id="map"><svg id="sv"></svg><div class="col" id="c1"></div><div class="col" id="c2"></div><div class="col" id="c3"></div></div>
<script>

{n:"Stack",c:"#a78bfa",s:[["Questions",L("Valid Parentheses|20;Min Stack|155;Stack using Queue|225;Evaluate Reverse Polish Notation|150;Next Greater Element|496;Daily Temperatures|739")]]},
{n:"Queue",c:"#2dd4bf",s:[["Types",L("Queue;Circular Queue;Deque")],["Questions",L("Queue using 2 stacks|232")]]},
{n:"Backtracking",c:"#fb923c",s:[["Problems",L("Subsets|78;Permutations|46;Combinations|77;Combination Sum|39")]]},
{n:"Heap / Priority Queue",c:"#f87171",s:[["Concepts",L("Min heap, Max heap;heapify")],["Questions",L("Kth Largest Element in an Array|215;Kth Smallest Element;Top K Frequent Elements|347")]]},
{n:"Binary Tree",c:"#34d399",s:[["Traversals",L("Traversal (in, pre, post)|94, 144, 145;Level Order Traversal|102;View (left, right, top, bottom)")],["Questions",L("Maximum Depth of Binary Tree|104;Diameter of Binary Tree|543;Balanced Binary Tree|110;Invert Binary Tree|226;Lowest Common Ancestor|236;Path Sum|112;Binary Tree Maximum Path Sum|124;Validate / Compare / Symmetric Tree|98, 100, 101;Construct Binary Tree from Preorder + Inorder|105")]]},
{n:"BST",c:"#facc15",s:[["Questions",L("Search in BST|700;Insert into BST|701;Delete Node in BST|450;Validate BST|98;Kth Smallest Element in BST|230;LCA of BST|235;Minimum/Maximum in BST;Inorder Successor / Predecessor")]]},
{n:"Graph",c:"#38bdf8",s:[["Traversal & Connectivity",L("BFS;DFS;Number of Islands|200;Flood Fill|733;Number of Connected Components|323;Number of Provinces|547;Bipartite Graph|785;Topological Sort;Detect Cycle in Undirected Graph;Detect Cycle in Directed Graph;Course Schedule|207")],["Shortest Path & MST",L("Dijkstra;Bellman-Ford;Kruskal's Algorithm;Prim's Algorithm;Union Find / DSU")]]}
];
var st={t:-1,s:-1},fresh=false,done={};
try{done=JSON.parse(localStorage.getItem("dsa-done")||"{}")}catch(e){}
var U={704:"binary-search",1:"two-sum",283:"move-zeroes",26:"remove-duplicates-from-sorted-array",169:"majority-element",268:"missing-number",15:"3sum",11:"container-with-most-water",75:"sort-colors",189:"rotate-array",31:"next-permutation",56:"merge-intervals",287:"find-the-duplicate-number",73:"set-matrix-zeroes",54:"spiral-matrix",48:"rotate-image",238:"product-of-array-except-self",560:"subarray-sum-equals-k",206:"reverse-linked-list",876:"middle-of-the-linked-list",141:"linked-list-cycle",19:"remove-nth-node-from-end-of-list",21:"merge-two-sorted-lists",160:"intersection-of-two-linked-lists",234:"palindrome-linked-list",2:"add-two-numbers",146:"lru-cache",20:"valid-parentheses",155:"min-stack",225:"implement-stack-using-queues",150:"evaluate-reverse-polish-notation",496:"next-greater-element-i",739:"daily-temperatures",232:"implement-queue-using-stacks",78:"subsets",46:"permutations",77:"combinations",39:"combination-sum",215:"kth-largest-element-in-an-array",347:"top-k-frequent-elements",94:"binary-tree-inorder-traversal",144:"binary-tree-preorder-traversal",145:"binary-tree-postorder-traversal",102:"binary-tree-level-order-traversal",104:"maximum-depth-of-binary-tree",543:"diameter-of-binary-tree",110:"balanced-binary-tree",226:"invert-binary-tree",236:"lowest-common-ancestor-of-a-binary-tree",112:"path-sum",124:"binary-tree-maximum-path-sum",98:"validate-binary-search-tree",100:"same-tree",101:"symmetric-tree",105:"construct-binary-tree-from-preorder-and-inorder-traversal",700:"search-in-a-binary-search-tree",701:"insert-into-a-binary-search-tree",450:"delete-node-in-a-bst",230:"kth-smallest-element-in-a-bst",235:"lowest-common-ancestor-of-a-binary-search-tree",200:"number-of-islands",733:"flood-fill",323:"number-of-connected-components-in-an-undirected-graph",547:"number-of-provinces",785:"is-graph-bipartite",207:"course-schedule",5:"longest-palindromic-substring",151:"reverse-words-in-a-string",125:"valid-palindrome",344:"reverse-string",680:"valid-palindrome-ii",14:"longest-common-prefix",242:"valid-anagram",49:"group-anagrams",387:"first-unique-character-in-a-string",383:"ransom-note",205:"isomorphic-strings",290:"word-pattern",3:"longest-substring-without-repeating-characters",424:"longest-repeating-character-replacement",567:"permutation-in-string",438:"find-all-anagrams-in-a-string",76:"minimum-window-substring",340:"longest-substring-with-at-most-k-distinct-characters",1047:"remove-all-adjacent-duplicates-in-string",394:"decode-string",227:"basic-calculator-ii",32:"longest-valid-parentheses",844:"backspace-string-compare",1209:"remove-all-adjacent-duplicates-in-string-ii",647:"palindromic-substrings",131:"palindrome-partitioning",214:"shortest-palindrome",1143:"longest-common-subsequence",516:"longest-palindromic-subsequence",72:"edit-distance",139:"word-break",115:"distinct-subsequences",44:"wildcard-matching",10:"regular-expression-matching",28:"find-the-index-of-the-first-occurrence-in-a-string",459:"repeated-substring-pattern",1392:"longest-happy-prefix",8:"string-to-integer-atoi",415:"add-strings",43:"multiply-strings",13:"roman-to-integer",443:"string-compression",6:"zigzag-conversion",22:"generate-parentheses",17:"letter-combinations-of-a-phone-number",208:"implement-trie-prefix-tree",211:"design-add-and-search-words-data-structure",212:"word-search-ii",127:"word-ladder",269:"alien-dictionary",271:"encode-and-decode-strings",763:"partition-labels",451:"sort-characters-by-frequency",767:"reorganize-string",692:"top-k-frequent-words",191:"number-of-1-bits",231:"power-of-two",136:"single-number","gfg-even-odd":"https://www.geeksforgeeks.org/problems/odd-or-even3618/1","gfg-kth-set":"https://www.geeksforgeeks.org/problems/check-whether-k-th-bit-is-set-or-not-1587115620/1","gfg-set-kth":"https://www.geeksforgeeks.org/problems/set-kth-bit3724/1","gfg-unset-kth":"https://www.geeksforgeeks.org/problems/unset-kth-bit4616/1","gfg-toggle-kth":"https://www.geeksforgeeks.org/problems/toggle-bits-given-range0952/1","g function lk(n,t){var u=U[n]||n;var h=(typeof u==="string"&&u.indexOf("http")===0)?u:"https://leetcode.com/problems/"+u+"/";return'<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>'}
function nm(P){var ns=P[1]?P[1].split(/,\s*/):[];return ns.length===1&&U[ns[0]]?lk(ns[0],P[0]):P[0]}
function nu(P){if(!P[1])return"";var ns=P[1].split(/,\s*/);return'<em>('+ns.map(function(n){var d=n.indexOf("gfg")===0?"GFG":n;return(U[n]?lk(n,d):d)+(PR[n]?' <span title="LeetCode Premium">\ud83d\udd12</span>':'')}).join(", ")+')</em>'}
function key(t,s,q){return (D[t]?D[t].n:t)+"|"+s+"|"+q}
function isD(t,s,q){return done[key(t,s,q)]||done[t+"|"+s+"|"+q]}
function cnt(t,s){var d=0,n=0;D[t].s.forEach(function(x,si){if(s!=null&&s!==si)return;x[1].forEach(function(q,qi){n++;if(isD(t,si,qi))d++})});return[d,n]}
function render(){
 var c1="",c2="",c3="",tot=0,dn=0,a=fresh?" a":"";
 D.forEach(function(t,i){var p=cnt(i);tot+=p[1];dn+=p[0];
  c1+='<button class="node'+(st.t===i?' on':'')+(st.t>=0&&st.t!==i?' dim':'')+'" data-t="'+i+'" style="--c:'+t.c+'">'+t.n+'<small>'+p[0]+' / '+p[1]+' done</small><div class="mini"><i style="width:'+(p[0]/p[1]*100)+'%"></i></div></button>'});
 if(st.t>=0){var T=D[st.t];
  T.s.forEach(function(s,j){var p=cnt(st.t,j);c2+='<button class="node'+(st.s===j?' on':'')+(st.s>=0&&st.s!==j?' dim':'')+'" data-s="'+j+'" style="--c:'+T.c+'">'+s[0]+'<small>'+p[0]+' / '+p[1]+' questions</small></button>'});
  c2='<div class="col'+a+'">'+c2+'</div>';
  if(st.s>=0){var S=T.s[st.s];c3='<div class="panel'+a+'" id="pn" style="--c:'+T.c+'"><h3>'+S[0]+'</h3>';
   S[1].forEach(function(q,k){var P=q.split("|"),d=isD(st.t,st.s,k);c3+='<label class="q'+(d?' d':'')+'"><input type="checkbox" data-q="'+k+'"'+(d?' checked':'')+'><span>'+nm(P)+'</span>'+nu(P)+'</label>'});c3+='</div>'}
 } else c2='<div class="hint">👈 Pick a topic to see its sub-topics</div>';
 
 g("c1").innerHTML=c1;g("c2").innerHTML=c2;g("c3").innerHTML=c3;
 g("ov").textContent=dn+" of "+tot+" completed";g("ob").style.width=(dn/tot*100)+"%";
 var tb=document.querySelector('[data-t="'+st.t+'"]'),sb=document.querySelector('[data-s="'+st.s+'"]'),w=innerWidth>760&&tb;
 g("c2").style.marginTop=w?tb.offsetTop+"px":"0";
 g("c3").style.marginTop=w?(tb.offsetTop+(sb?sb.offsetTop:0))+"px":"0";
 fresh=false;requestAnimationFrame(function(){setTimeout(draw,380)});draw();
}
function g(i){return document.getElementById(i)}
function draw(){
 var m=g("map").getBoundingClientRect(),svg=g("sv"),h="";
 if(innerWidth>760&&st.t>=0){
  var T=D[st.t],from=document.querySelector('[data-t="'+st.t+'"]');
  document.querySelectorAll("[data-s]").forEach(function(b){h+=pth(from,b,T.c,m)});
  var sb=st.s>=0&&document.querySelector('[data-s="'+st.s+'"]'),pn=g("pn");
  if(sb&&pn)h+=pth(sb,pn,T.c,m);
 }
 svg.innerHTML=h;
}
function pth(a,b,c,m){var A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
 var x1=A.right-m.left,y1=A.top+A.height/2-m.top,x2=B.left-m.left,y2=B.top+Math.min(B.height/2,22)-m.top,mx=(x1+x2)/2;
 return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>'}
g("map").addEventListener("click",function(e){
 var t=e.target.closest("[data-t]"),s=e.target.closest("[data-s]");
 if(t){var i=+t.dataset.t;st={t:st.t===i?-1:i,s:-1};fresh=true;render()}
 else if(s){var j=+s.dataset.s;st.s=st.s===j?-1:j;fresh=true;render()}
});
g("map").addEventListener("change",function(e){
 var q=e.target.dataset&&e.target.dataset.q;if(q==null)return;
 var k=key(st.t,st.s,q);if(e.target.checked)done[k]=1;else{delete done[k];delete done[st.t+"|"+st.s+"|"+q]}
 try{localStorage.setItem("dsa-done",JSON.stringify(done))}catch(x){}
 render();
});
addEventListener("resize",render);
var root=document.documentElement;
function isDark(){var t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setBtn(){g("tg").textContent=isDark()?"☀️ Light":"🌙 Dark"}
try{var sv=localStorage.getItem("dsa-theme");if(sv)root.dataset.theme=sv}catch(e){}
g("tg").onclick=function(){var n=isDark()?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("dsa-theme",n)}catch(e){}setBtn()};
setBtn();
render();
</script>
